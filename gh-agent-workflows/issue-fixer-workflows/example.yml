name: Issue Fixer — workflows
on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  copilot-requests: write
  discussions: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-fixer-workflows.lock.yml@v0
    # with:
      # Elastic-specific (OIDC): mint an ephemeral token inside the lock workflow so
      # PRs (including .github/workflow changes) re-trigger CI. Requires Elastic
      # TokenPolicy / ephemeral-token infrastructure and id-token: write on this job.
      # Leave unset outside Elastic; workflow-file pushes may fail with GITHUB_TOKEN alone.
      # github-token-policy: "<shared-token-policy-id>"
