                GH_AW_EXPR_49B959F1: process.env.GH_AW_EXPR_49B959F1,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_EVENT_ISSUE_NUMBER: process.env.GH_AW_GITHUB_EVENT_ISSUE_NUMBER,
                GH_AW_GITHUB_EVENT_ISSUE_TITLE: process.env.GH_AW_GITHUB_EVENT_ISSUE_TITLE,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED,
                GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT: process.env.GH_AW_STEPS_SANITIZED_OUTPUTS_TEXT
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      issues: read
      pull-requests: read
    concurrency:
      group: "gh-aw-copilot-${{ github.workflow }}-mention-issue-no-sandbox-${{ github.event.issue.number }}"
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: ghawmentioninissuenosandbox
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      artifact_prefix: ${{ needs.activation.outputs.artifact_prefix }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw/actions/setup@73def1609c73c93951bc9c9e31eef524dfd2162e # v0.87.1
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Mention in Issue (no sandbox)"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/gh-aw-mention-in-issue-no-sandbox.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@423b3dc04bbf1b1797194a4a75aa5cf5d0d4f5b3 # v0.87.1
        with:
          version: 'v0.87.1'
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Capture GOROOT for AWF chroot mode
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          python-version-file: '.python-version'
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start DIFC Proxy
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_HOST: ${{ env.GH_HOST }}
          GITHUB_HOST: ${{ env.GITHUB_HOST }}
          GITHUB_ENTERPRISE_HOST: ${{ env.GITHUB_ENTERPRISE_HOST }}
          GITHUB_GRAPHQL_URL: ${{ env.GITHUB_GRAPHQL_URL }}
          GITHUB_COPILOT_BASE_URL: ${{ env.GITHUB_COPILOT_BASE_URL }}
          DIFC_PROXY_POLICY: '{"allow-only":{"min-integrity":"approved","repos":"all"}}'
          DIFC_PROXY_IMAGE: 'ghcr.io/github/gh-aw-mcpg:v0.4.9'
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/start_difc_proxy.sh"
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}activation
          path: /tmp/gh-aw
      - name: Setup Node.js (.node-version)
        if: hashFiles('.node-version') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
        with:
          node-version-file: .node-version
      - name: Setup Node.js (.nvmrc)
        if: hashFiles('.node-version') == '' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
        with:
          node-version-file: .nvmrc
      - name: Setup Ruby
        if: hashFiles('.ruby-version') != ''
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0 (source v1)
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup uv
        id: setup-uv
        if: hashFiles('pyproject.toml', 'uv.lock') != ''
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
      - name: Expose uv in workspace
        if: hashFiles('pyproject.toml', 'uv.lock') != ''
        run: |
          set -euo pipefail
          # AWF-friendly location: gh-aw scans /opt/hostedtoolcache/**/bin paths.
          toolcache_bin="/opt/hostedtoolcache/gh-aw-tools/current/x64/bin"
          sudo mkdir -p "$toolcache_bin"
          sudo ln -sf "$UV_PATH" "$toolcache_bin/uv"
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        shell: bash
      - name: Configure Copilot CLI settings
        run: |
          set -euo pipefail
          mkdir -p ~/.copilot
          CONFIG="$HOME/.copilot/config.json"
          if [ -f "$CONFIG" ]; then
              jq '. + {"chat.customAgentInSubagent.enabled": true}' "$CONFIG" > "$CONFIG.tmp" && mv "$CONFIG.tmp" "$CONFIG"
          else
              echo '{"chat.customAgentInSubagent.enabled":true}' > "$CONFIG"
          fi
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
        shell: bash
      - name: Fetch repository conventions
        run: |
          set -euo pipefail
          if [ -f "AGENTS.md" ]; then
            cp AGENTS.md /tmp/agents.md
            echo "Repository conventions copied from AGENTS.md to /tmp/agents.md"
          else
            echo "No AGENTS.md found; continuing without repository conventions"
          fi
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
        shell: bash
      - name: Write Playwright instructions to disk
        run: |
          cat > /tmp/playwright-instructions.md << 'EOF'
          # Playwright MCP Tools

          Use Playwright MCP tools for interactive browser automation.
          Unless otherwise instructed, use the MCP tools directly rather than writing standalone Node.js scripts.

          ## Available tools

          - `browser_navigate` — go to a URL
          - `browser_click` — click an element
          - `browser_type` — type text into an input
          - `browser_snapshot` — get an accessibility tree (YAML) of the current page
          - `browser_take_screenshot` — capture a visual screenshot (PNG/JPEG)
          - `browser_run_code` — run a Playwright code snippet
          - `browser_wait_for` — wait for text to appear/disappear
          - `browser_press_key` — press a keyboard key

          ## Automatic snapshots are disabled

          `browser_click`, `browser_type`, `browser_wait_for`, and
          `browser_run_code` do NOT return page state. You choose when to
          inspect the page.

          ## Batch actions with `browser_run_code`

          When you know the UI structure (button names, input labels), batch
          multiple actions in a single `browser_run_code` call using Playwright's
          role selectors. This is much more efficient than individual tool calls:

          ```js
          async (page) => {
            await page.getByRole('button', { name: 'Settings' }).click();
            await page.getByRole('combobox', { name: 'Theme' }).selectOption('dark');
            await page.getByRole('button', { name: 'Save' }).click();
            return 'Settings saved';
          }
          ```

          **Keep return values small** — return only what you need:
          ```js
          async (page) => {
            const res = await page.request.post(url, {data});
            const json = await res.json();
            // Good: ~50 chars
            return JSON.stringify({success: json.success, errors: json.errors?.length || 0});
            // Bad: entire response body (can be 20K+ chars)
          }
          ```

          ## Discover elements with snapshots

          When you don't know what's on the page, save a snapshot to disk and
          search it:
          ```
          browser_snapshot(filename="/tmp/gh-aw/mcp-logs/page.md")
          ```
          Then grep for elements:
          ```bash
          grep 'button.*Save\|button.*Submit' /tmp/gh-aw/mcp-logs/page.md
          ```
          Use the `ref` value from grep results with `browser_click(ref="...")`.

          Only take snapshots when you need to discover unknown elements.
          If you know the button name or role, use `browser_run_code` instead.

          ## Error handling in `browser_run_code`

          `browser_run_code` blocks can fail mid-execution if a selector doesn't
          match. Keep blocks focused — if a sequence has uncertain steps, split
          it into separate `browser_run_code` calls so you can inspect and adapt
          between them.

          ## Measuring DOM properties

          For programmatic checks (e.g. element heights, contrast), use
          `browser_run_code`:

          ```javascript
          async (page) => {
            const els = await page.locator('input, button, [role="combobox"]').all();
            const results = [];
            for (const el of els.slice(0, 10)) {
              const box = await el.boundingBox();
              const text = await el.textContent();
              if (box) results.push({ h: Math.round(box.height), text: text?.trim().slice(0, 20) });
            }
            return JSON.stringify(results);
          }
          ```

          ## Handling failures

          - Do not retry the same action more than twice — the page is in a different state than expected.
          - Diagnose before moving on: save a snapshot to disk and grep it, or use `browser_take_screenshot` for a visual check.
          - Adapt (different selector, different path) or report the failure as a finding.
          - Never claim you verified something you didn't — if it failed and you skipped it, say so.
          EOF
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
      - name: Repo-specific setup
        if: ${{ inputs.setup-commands != '' }}
        run: eval "$SETUP_COMMANDS"
        env:
          GH_HOST: ${{ env.GH_HOST || 'github.com' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: https://localhost:18443/api/v3
          GITHUB_GRAPHQL_URL: https://localhost:18443/api/graphql
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_EXTRA_CA_CERTS: /tmp/gh-aw/proxy-logs/proxy-tls/ca.crt
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/checkout_pr_branch.cjs');
            await main();
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh"
        env:
          GH_HOST: github.com
          GH_AW_COMPILED_VERSION: v0.87.1
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
          GH_AW_GITHUB_MIN_INTEGRITY: 'approved'
        with:
          script: |
            const determineAutomaticLockdown = require('${{ runner.temp }}/gh-aw/actions/determine_automatic_lockdown.cjs');
            await determineAutomaticLockdown(github, context, core);
      - name: Parse integrity filter lists
        id: parse-guard-vars
        env:
          GH_AW_BLOCKED_USERS_VAR: ${{ vars.GH_AW_GITHUB_BLOCKED_USERS || '' }}
          GH_AW_TRUSTED_USERS_EXTRA: ${{ inputs.allowed-bot-users }}
          GH_AW_TRUSTED_USERS_VAR: ${{ vars.GH_AW_GITHUB_TRUSTED_USERS || '' }}
          GH_AW_APPROVAL_LABELS_VAR: ${{ vars.GH_AW_GITHUB_APPROVAL_LABELS || '' }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/parse_guard_list.sh"
      - name: Stop DIFC Proxy
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/stop_difc_proxy.sh"
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-node@sha256:0d9f1fb5fd6610c0ac1f5194a38e45a8a1e81f8a390d5142d8e4e6f26a4b3196 ghcr.io/github/github-mcp-server:v1.9.0@sha256:881b53d6f75f69bdbc1b5b10fc2f1361717c19054143b3a8529fb5c32061a50e mcr.microsoft.com/playwright/mcp
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
