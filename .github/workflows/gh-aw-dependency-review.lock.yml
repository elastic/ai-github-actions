name: "Dependency Review"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      additional-instructions:
        default: ""
        description: Repo-specific instructions appended to the agent prompt
        required: false
        type: string
      allowed-bot-users:
        default: github-actions[bot]
        description: Allowed bot actor usernames (comma-separated)
        required: false
        type: string
      classification-labels:
        default: ""
        description: Comma-separated list of labels the agent may apply (e.g. 'needs-human-review,higher-risk,merge-ready'). If empty, no labels are applied. Define label semantics in additional-instructions.
        required: false
        type: string
      messages-footer:
        default: ""
        description: Footer appended to all agent comments and reviews
        required: false
        type: string
      model:
        default: gpt-5.3-codex
        description: AI model to use
        required: false
        type: string
      report-failure-as-issue:
        default: true
        description: When true, agent failures are reported as GitHub issues
        required: false
        type: boolean
      setup-commands:
        default: ""
        description: Shell commands to run before the agent starts (dependency install, build, etc.)
        required: false
        type: string
    outputs:
      comment_id:
        description: ID of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_id }}
      comment_url:
        description: URL of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_url }}
    secrets:
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-dependency-review-${{ github.event.pull_request.number }}

run-name: "Dependency Review"

jobs:
  activation:
    needs: pre_activation
    if: needs.pre_activation.outputs.activated == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      artifact_prefix: ${{ steps.artifact-prefix.outputs.prefix }}
