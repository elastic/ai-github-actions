name: "Mention in PR (no sandbox)"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      additional-instructions:
        default: ""
        description: Repo-specific instructions appended to the agent prompt
        required: false
        type: string
      allowed-bot-users:
        default: github-actions[bot]
        description: Allowed bot actor usernames (comma-separated)
        required: false
        type: string
      create-pull-request-review-comment-max:
        default: "30"
        description: Maximum number of review comments the agent can create per run
        required: false
        type: string
      messages-footer:
        default: ""
        description: Footer appended to all agent comments and reviews
        required: false
        type: string
      model:
        default: gpt-5.3-codex
        description: AI model to use
        required: false
        type: string
      report-failure-as-issue:
        default: true
        description: When true, agent failures are reported as GitHub issues
        required: false
        type: boolean
      resolve-pull-request-review-thread-max:
        default: "10"
        description: Maximum number of review threads the agent can resolve per run
        required: false
        type: string
      setup-commands:
        default: ""
        description: Shell commands to run before the agent starts (dependency install, build, etc.)
        required: false
        type: string
    outputs:
      comment_id:
        description: ID of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_id }}
      comment_url:
        description: URL of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_url }}
      push_commit_sha:
        description: SHA of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_sha }}
      push_commit_url:
        description: URL of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_url }}
    secrets:
      EXTRA_COMMIT_GITHUB_TOKEN:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-mention-pr-no-sandbox-${{ github.event.pull_request.number || github.event.issue.number }}

run-name: "Mention in PR (no sandbox)"

