---
name: "Internal: Smoke Test — Install & Compile"
on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: none

jobs:
  smoke-test:
    name: Install and compile ${{ matrix.workflow }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - agent-efficiency
          - agent-suggestions
          - breaking-change-detector
          - bug-hunter
          - code-complexity-detector
          - code-duplication-detector
          - docs-patrol
          - duplicate-issue-detector
          - estc-docs-patrol-external
          - estc-docs-pr-review
          - estc-newbie-contributor-patrol-external
          - estc-pr-buildkite-detective
          - flaky-test-investigator
          - issue-fixer
          - issue-triage
          - mention-in-issue
          - mention-in-pr
          - newbie-contributor-patrol
          - performance-profiler
          - pr-actions-detective
          - pr-actions-fixer
          - pr-review
          - project-summary
          - release-update
          - scheduled-audit
          - scheduled-fix
          - small-problem-fixer
          - stale-issues
          - test-coverage-detector
          - text-auditor
          - update-pr-body
    env:
      GH_AW_VERSION: "v0.87.4"
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install pinned gh-aw CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOBIN="$HOME/.local/bin" go install "github.com/github/gh-aw/cmd/gh-aw@${GH_AW_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh-aw" version

      - name: Create a fresh repo
        run: |
          mkdir /tmp/test-repo && cd /tmp/test-repo
          git init -b main
          git config user.name "smoke-test"
          git config user.email "smoke-test@localhost"
          git commit --allow-empty -m "init"

      - name: Install workflow
        working-directory: /tmp/test-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh-aw add "elastic/ai-github-actions/.github/workflows/gh-aw-${{ matrix.workflow }}.md" --non-interactive

      - name: Verify lock files
        working-directory: /tmp/test-repo
        run: |
          set -euo pipefail
          SHIM=".github/workflows/gh-aw-${{ matrix.workflow }}.md"
          LOCK=".github/workflows/gh-aw-${{ matrix.workflow }}.lock.yml"

          echo "Shim: ${SHIM}"
          echo "Lock file: ${LOCK}"

          if [ ! -f "$SHIM" ]; then
            echo "::error::Expected shim was not generated: ${SHIM}"
            exit 1
          fi

          if [ ! -f "$LOCK" ]; then
            echo "::error::Expected lock file was not generated: ${LOCK}"
            exit 1
          fi

          echo "${{ matrix.workflow }} installed and compiled successfully."
